[FilterPlugin]
; This section lists additional files which will be packaged along with your plugin. Paths should be listed relative to the root plugin directory, and
; may include "...", "*", and "?" wildcards to match directories, files, and individual characters respectively.
;
; Examples:
;    /README.txt
;    /Extras/...
;    /Binaries/ThirdParty/*.dll

; The Windows module detects the SDK header at build time. Keep the official
; WebView2 header and loader in source plugin packages so a consuming project
; can rebuild the SDK-enabled implementation instead of the fallback.
/Config/FilterPlugin.ini
/Content/...
/Binaries/Win64/VeloWebViewBrowserHost.exe
/Shared/...
/ThirdParty/...
