<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Velo WebView Host</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: "Microsoft YaHei", "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #11151b;
      color: #f3f5f7;
    }

    body {
      position: relative;
    }

    #host-toolbar {
      position: fixed;
      top: 12px;
      left: 12px;
      z-index: 1000;
      display: flex;
      align-items: center;
      user-select: none;
    }

    .host-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px;
      border: 1px solid rgba(83, 97, 116, 0.9);
      border-radius: 8px;
      background: rgba(32, 39, 49, 0.94);
      box-shadow: 0 3px 12px rgba(0, 0, 0, 0.35);
      opacity: 1;
      transition: opacity 180ms ease, transform 180ms ease;
    }

    .host-button {
      min-width: 60px;
      padding: 7px 12px;
      border: 1px solid #536174;
      border-radius: 5px;
      background: #2c3746;
      color: inherit;
      cursor: pointer;
      font: inherit;
    }

    .host-button:hover { background: #3a485a; }
    .host-button:active { background: #4a5b71; }
    .host-button:focus-visible { outline: 2px solid #6ca8ff; outline-offset: 1px; }

    #host-drawer-toggle {
      position: fixed;
      top: 12px;
      left: 0;
      z-index: 1001;
      width: 30px;
      height: 42px;
      padding: 0;
      border: 1px solid #536174;
      border-left: 0;
      border-radius: 0 8px 8px 0;
      background: rgba(32, 39, 49, 0.96);
      color: inherit;
      cursor: pointer;
      font: 600 21px/1 "Microsoft YaHei", "Segoe UI", sans-serif;
      box-shadow: 2px 3px 10px rgba(0, 0, 0, 0.3);
      opacity: 0;
      visibility: hidden;
      transition: opacity 180ms ease, background 180ms ease, visibility 180ms;
    }

    #host-drawer-toggle:hover { background: #3a485a; }
    #host-drawer-toggle:focus-visible { outline: 2px solid #6ca8ff; outline-offset: 2px; }

    #host-toolbar.is-collapsed .host-actions {
      display: none;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    #host-toolbar.is-collapsed {
      display: none;
    }

    #host-toolbar.is-collapsed + #host-drawer-toggle {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }

    #host-frame {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      background: #fff;
    }
  </style>
</head>
<body>
  <header id="host-toolbar" role="toolbar" aria-label="网页控制栏">
    <div id="host-actions" class="host-actions" aria-hidden="false">
      <button id="host-exit" class="host-button" type="button">退出</button>
      <button id="host-refresh" class="host-button" type="button">刷新</button>
    </div>
  </header>
  <button id="host-drawer-toggle" type="button" aria-label="显示网页控制按钮" aria-expanded="true">›</button>

  <iframe
    id="host-frame"
    title="网页内容"
    src="about:blank"
    allow="autoplay; fullscreen; picture-in-picture; encrypted-media"
    allowfullscreen></iframe>

  <script>
    (function () {
      "use strict";

      var frame = document.getElementById("host-frame");
      var toolbar = document.getElementById("host-toolbar");
      var actions = document.getElementById("host-actions");
      var drawerToggle = document.getElementById("host-drawer-toggle");
      var initialURL = "__VELO_HOST_IFRAME_URL__";
      var hideTimer = null;
      var toolbarHideDelay = 3000;

      function setToolbarCollapsed(collapsed) {
        toolbar.classList.toggle("is-collapsed", collapsed);
        actions.setAttribute("aria-hidden", String(collapsed));
        drawerToggle.setAttribute("aria-expanded", String(!collapsed));
      }

      function scheduleToolbarCollapse() {
        if (hideTimer !== null) window.clearTimeout(hideTimer);
        hideTimer = window.setTimeout(function () {
          setToolbarCollapsed(true);
          hideTimer = null;
        }, toolbarHideDelay);
      }

      function showToolbar() {
        setToolbarCollapsed(false);
        scheduleToolbarCollapse();
      }

      function postToUE(type, fields) {
        var payload = { source: "VeloHost", type: type };
        if (fields) {
          Object.keys(fields).forEach(function (key) { payload[key] = fields[key]; });
        }
        if (window.VeloWebView && typeof window.VeloWebView.postMessage === "function") {
          window.VeloWebView.postMessage(JSON.stringify(payload));
        }
      }

      function normalizeURL(value) {
        var url = String(value == null ? "" : value).trim();
        if (!url) return "about:blank";
        // Host navigation is intentionally limited to browser URLs. This also
        // prevents a message from turning the iframe into a javascript: sink.
        if (/^(https?:|about:|file:)/i.test(url)) return url;
        return "https://" + url;
      }

      function setIframeURL(value, notify) {
        var url = normalizeURL(value);
        frame.src = url;
        if (notify !== false) postToUE("iframe-url-changed", { url: url });
        return url;
      }

      function refreshIframe(notify) {
        var url = frame.src || "about:blank";
        // Assigning src works for cross-origin frames as well as same-origin
        // frames, whereas contentWindow.location.reload() is restricted by
        // some embedded browser versions.
        frame.src = url;
        if (notify !== false) postToUE("iframe-refresh", { url: url });
        return url;
      }

      function requestExit() {
        postToUE("exit");
      }

      window.VeloHost = {
        setIframeURL: setIframeURL,
        setIframeUrl: setIframeURL,
        getIframeURL: function () { return frame.src || "about:blank"; },
        refreshIframe: refreshIframe,
        requestExit: requestExit,
        // Kept as a no-op for compatibility with callers that still send a
        // title update. The host title element has been removed.
        setTitle: function () {}
      };

      drawerToggle.addEventListener("click", showToolbar);
      document.addEventListener("click", scheduleToolbarCollapse, true);
      scheduleToolbarCollapse();

      document.getElementById("host-refresh").addEventListener("click", function () {
        refreshIframe(true);
      });
      document.getElementById("host-exit").addEventListener("click", function () {
        requestExit();
      });

      frame.addEventListener("load", function () {
        postToUE("iframe-loaded", { url: frame.src || "about:blank" });
      });
      frame.addEventListener("error", function () {
        postToUE("iframe-error", { url: frame.src || "about:blank" });
      });

      // UE can use ExecuteJavaScript with window.postMessage when it wants to
      // keep the host page API independent from its own JavaScript string
      // escaping. The direct VeloHost methods above are also available.
      window.addEventListener("message", function (event) {
        var data = event && event.data;
        if (typeof data === "string") {
          try { data = JSON.parse(data); } catch (ignore) {}
        }
        if (!data || typeof data !== "object") return;
        if (data.type === "set-iframe-url" || data.type === "setIframeURL") {
          setIframeURL(data.url, true);
        } else if (data.type === "refresh-iframe" || data.type === "refreshIframe") {
          refreshIframe(true);
        } else if (data.type === "set-title") {
          window.VeloHost.setTitle(data.title);
        }
      });

      if (initialURL.indexOf("VELO_HOST_IFRAME_URL") !== -1) {
        setIframeURL("about:blank", false);
      } else {
        setIframeURL(initialURL, false);
      }
    }());
  </script>
</body>
</html>
